# Test YAML Configuration with RawConfig structure
# Contains valid variants of models, workflows, and routes

models:
  - name: basic_ingress_model
    description: Ingress model with file and dataset information
    is_ingress: true
    version: "1.0.0"
    schema_:
      schemapack: 4.0.0
      classes:
        File:
          id:
            propertyName: alias
          content:
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "description": "A file is an object that contains information generated from a process, either an Experiment or an Analysis.",
              "properties":
                {
                  "checksum": { "type": "string" },
                  "filename": { "type": "string" },
                  "format": { "type": "string" },
                  "size": { "type": "integer" },
                },
              "required":
                ["filename", "format", "checksum", "size"],
              "type": "object",
            }
        Dataset:
          id:
            propertyName: alias
          content:
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "description": "A dataset that is a collection of files.",
              "properties":
                {
                  "dac_contact": { "type": "string" },
                },
              "type": "object",
            }
          relations:
            files:
              targetClass: File
              multiple:
                origin: true
                target: true
              mandatory:
                origin: false
                target: true
    publish: false

  - name: ingress_files_only
    description: EMIM containing only file information
    is_ingress: true
    version: "1.0.0"
    schema_:
      schemapack: 4.0.0
      classes:
        File:
          id:
            propertyName: alias
          content:
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "description": "A file is an object that contains information generated from a process, either an Experiment or an Analysis.",
              "properties":
                {
                  "checksum": { "type": "string" },
                  "filename": { "type": "string" },
                  "format": { "type": "string" },
                  "size": { "type": "integer" },
                },
              "required":
                ["filename", "format", "checksum", "size"],
              "type": "object",
            }
    publish: false

  - name: extracted_file_information
    description: Model containing only specific file information
    is_ingress: false
    version: "2.0.0"
    schema_: null
    publish: false

  - name: processed_file_information
    description: Model containing enriched file information
    is_ingress: false
    version: "3.0.0"
    schema_: null
    publish: true


workflows:
  - name: extract_file_information
    description: Extract specific file information for further processing
    workflow:
      operations:
        - name: transform_content
          description: PLACEHOLDER
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "description": "A file is an object that contains information generated from a process, either an Experiment or an Analysis.",
              "properties": {
                "checksum": {
                  "type": "string"
                },
                "filename": {
                  "type": "string"
                },
                "format": {
                  "type": "string"
                },
                "size": {
                  "type": "integer"
                },
                "additional_information": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "compression": {
                      "type": "boolean"
                    }
                  },
                  "required": [
                    "compression"
                  ],
                },
                "content_description": {
                  "type" : "string"
                }
              },
              "required": [
                "filename",
                "format",
                "checksum",
                "size",
                "content_description",
              ],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: |
              {% for key in content_property_names %}
                {{ key }}: {{ original[key] }}
              {% endfor %}
  - name: process_file_information
    description: Quality control for genomic data
    workflow:
      operations:
        - name: transform_content
          description: PLACEHOLDER
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "description": "A file is an object that contains information generated from a process, either an Experiment or an Analysis.",
              "properties": {
                "checksum": {
                  "type": "string"
                },
                "filename": {
                  "type": "string"
                },
                "format": {
                  "type": "string"
                },
                "size": {
                  "type": "integer"
                },
                "additional_information": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "compression": {
                      "type": "boolean"
                    }
                  },
                  "required": [
                    "compression"
                  ],
                },
                "content_description": {
                  "type" : "string"
                }
              },
              "required": [
                "filename",
                "format",
                "checksum",
                "size",
                "content_description",
              ],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: |
              {% for key in content_property_names %}
                {{ key }}: {{ original[key] }}
              {% endfor %}
routes:
  - input_model_name: basic_ingress_model
    workflow_name: extract_file_information
    output_model_name: extracted_file_information

  - input_model_name: extracted_file_information
    workflow_name: process_file_information
    output_model_name: processed_file_information

  - input_model_name: ingress_files_only
    workflow_name: process_file_information
    output_model_name: processed_file_information
