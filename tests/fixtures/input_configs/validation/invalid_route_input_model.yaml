# Invalid: Route references non-existent input model
models:
  - name: existing_ingress_model
    description: Ingress model
    is_ingress: true
    version: "1.0.0"
    schema_:
      schemapack: "4.0.0"
      classes:
        TestClass:
          id:
            propertyName: id
          content:
            type: object
    publish: true

  - name: output_model
    description: Output model
    is_ingress: false
    version: "1.0.0"
    schema_: null
    publish: false

workflows:
  - name: test_workflow
    description: Test workflow
    workflow:
      operations:
        - name: delete_class
          description: Delete class operation
          args: {}

routes:
  - name: "nonexistent_model:test_workflow:output_model"
    input_model_name: nonexistent_model
    workflow_name: test_workflow
    output_model_name: output_model
