# Convergence graph where the two paths intrinsically produce incompatible
# schemas at D_out because the two intermediate branches are derived by
# different workflows.
#
# Graph:
#     I1 → D1 → D_out    (workflow_to_filename: File content = {filename})
#     I2 → D2 → D_out    (workflow_to_title:    File content = {title})
#
# D1→D_out produces a filename-only schema; D2→D_out produces a title-only
# schema.  The two schemas differ, so _process_routes raises.
#

models:
  - name: I1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 2
    schema_: &file_schema
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: ../_schemas/file_content.json

  - name: I2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_: *file_schema

  - name: D1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 3
    schema_: null

  - name: D2
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

  - name: D_out
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 4
    schema_: null

workflows:
  - name: workflow_to_filename
    description: Reduces the File content schema to filename only
    workflow:
      operations:
        - name: transform_content
          description: Keep only the filename property
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "filename": {"type": "string"}
              },
              "required": ["filename"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: "filename: test"

  - name: workflow_to_title
    description: Reduces the File content schema to title only
    workflow:
      operations:
        - name: transform_content
          description: Keep only the title property
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "title": {"type": "string"}
              },
              "required": ["title"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: "title: test"

routes:
  - input_model_name: I1
    workflow_name: workflow_to_filename
    output_model_name: D1

  - input_model_name: I2
    workflow_name: workflow_to_title
    output_model_name: D2

  - input_model_name: D1
    workflow_name: workflow_to_filename
    output_model_name: D_out

  - input_model_name: D2
    workflow_name: workflow_to_title
    output_model_name: D_out
