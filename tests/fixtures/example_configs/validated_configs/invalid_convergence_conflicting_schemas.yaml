# Convergence graph where the two paths intrinsically produce incompatible
# schemas at ConvergedModel because the two intermediate branches are derived by
# different workflows.
#
# Graph:
#     IngressModel1 → DerivedModel1 → ConvergedModel    (workflow_to_filename: File content = {filename})
#     IngressModel2 → DerivedModel2 → ConvergedModel    (workflow_to_title:    File content = {title})
#
# DerivedModel1→ConvergedModel produces a filename-only schema; DerivedModel2→ConvergedModel
# produces a title-only schema. The two schemas differ, so _process_routes raises.
#

models:
  - name: IngressModel1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 2
    schema_: &file_schema
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: ../_schemas/file_content.json

  - name: IngressModel2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_: *file_schema

  - name: DerivedModel1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 3
    schema_: null

  - name: DerivedModel2
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

  - name: ConvergedModel
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 4
    schema_: null

workflows:
  - name: workflow_to_filename
    description: Reduces the File content schema to filename only
    workflow:
      operations:
        - name: transform_content
          description: Keep only the filename property
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "filename": {"type": "string"}
              },
              "required": ["filename"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: "filename: test"

  - name: workflow_to_title
    description: Reduces the File content schema to title only
    workflow:
      operations:
        - name: transform_content
          description: Keep only the title property
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "title": {"type": "string"}
              },
              "required": ["title"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: "title: test"

routes:
  - input_model_name: IngressModel1
    workflow_name: workflow_to_filename
    output_model_name: DerivedModel1

  - input_model_name: IngressModel2
    workflow_name: workflow_to_title
    output_model_name: DerivedModel2

  - input_model_name: DerivedModel1
    workflow_name: workflow_to_filename
    output_model_name: ConvergedModel

  - input_model_name: DerivedModel2
    workflow_name: workflow_to_title
    output_model_name: ConvergedModel
