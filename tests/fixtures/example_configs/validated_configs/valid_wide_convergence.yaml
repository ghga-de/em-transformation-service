# Wide convergence: three ingress models converge to a single output
# through intermediate derived models.
#
# Graph:
#     I1 → D1 → D_out
#     I2 → D2 → D_out
#     I3 → D3 → D_out

models:
  - name: I1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 4
    schema_: &file_schema
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: ../_schemas/file_content.json

  - name: I2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 2
    schema_: *file_schema

  - name: I3
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_: *file_schema

  - name: D1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 5
    schema_: null

  - name: D2
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 3
    schema_: null

  - name: D3
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

  - name: D_out
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 6
    schema_: null

workflows:
  - name: replace_file_ids
    description: Replaces resource IDs for the File class
    workflow:
      operations:
        - name: replace_resource_ids
          description: Replace resource IDs
          args:
            class_name: File

  - name: rename_to_file_id
    description: Renames the File id property from alias to file_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename id from alias to file_id
          args:
            class_name: File
            id_property_name: file_id

routes:
  - input_model_name: I1
    workflow_name: replace_file_ids
    output_model_name: D1

  - input_model_name: I2
    workflow_name: replace_file_ids
    output_model_name: D2

  - input_model_name: I3
    workflow_name: replace_file_ids
    output_model_name: D3

  - input_model_name: D1
    workflow_name: rename_to_file_id
    output_model_name: D_out

  - input_model_name: D2
    workflow_name: rename_to_file_id
    output_model_name: D_out

  - input_model_name: D3
    workflow_name: rename_to_file_id
    output_model_name: D_out
