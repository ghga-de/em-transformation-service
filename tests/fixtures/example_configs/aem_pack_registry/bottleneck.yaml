# Bottleneck graph: two ingress models converge on a single bottleneck node,
# which then fans out to two derived models.
#
# Graph:
#     IngressModel1 → BottleneckModel → DerivedModel1
#     IngressModel2 ↗                 ↘ DerivedModel2

models:
  - name: IngressModel1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: IngressModel2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: BottleneckModel
    is_ingress: false
    version: null
    publish: false
    order: 1
    schema_: null

  - name: DerivedModel1
    is_ingress: false
    version: null
    publish: true
    order: 2
    schema_: null

  - name: DerivedModel2
    is_ingress: false
    version: null
    publish: true
    order: 3
    schema_: null

workflows:
  - name: rename_to_file_id
    description: Renames the id property to file_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename the id property to file_id
          args:
            class_name: File
            id_property_name: file_id

  - name: rename_to_resource_id
    description: Rename the id property to resource_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename the id property to resource_id
          args:
            class_name: File
            id_property_name: resource_id

routes:
  - input_model_name: IngressModel1
    workflow_name: rename_to_file_id
    output_model_name: BottleneckModel

  - input_model_name: IngressModel2
    workflow_name: rename_to_file_id
    output_model_name: BottleneckModel

  - input_model_name: BottleneckModel
    workflow_name: rename_to_resource_id
    output_model_name: DerivedModel1

  - input_model_name: BottleneckModel
    workflow_name: rename_to_resource_id
    output_model_name: DerivedModel2
