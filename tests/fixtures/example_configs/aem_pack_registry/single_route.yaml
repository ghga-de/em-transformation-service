# Single route: IngressModel → DerivedModel1 via rename_to_file_id.
#
# Graph:
#     IngressModel → DerivedModel1

models:
  - name: IngressModel
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: DerivedModel1
    is_ingress: false
    version: null
    publish: false
    order: 1
    schema_: null

workflows:
  - name: rename_to_file_id
    description: Rename the id property to file_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename the id property to file_id
          args:
            class_name: File
            id_property_name: file_id

routes:
  - input_model_name: IngressModel
    workflow_name: rename_to_file_id
    output_model_name: DerivedModel1
