# Convergence graph where two branches apply different combinations of the
# identity and non-identity (drop_format) transformations, yet both arrive at
# the same schema at the shared convergence node D_out.
#
# Graph:
#     I1 → D1 → D_out   (branch A: drop_format only)
#     I2 → D2 → D_out   (branch B: identity then drop_format)
#
# Branch A applies only the non-identity transformation (drop_format).
# Branch B applies the identity transformation first, then drop_format.
# Both intermediates (D1, D2) therefore carry a File schema without 'format',
# so they converge on D_out with a compatible schema.

models:
  - name: I1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 2
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["checksum", "filename", "format", "size"],
            "type": "object"
          }

  - name: I2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["checksum", "filename", "format", "size"],
            "type": "object"
          }

  - name: D1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 3
    schema_: null

  - name: D2
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

  - name: D_out
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 4
    schema_: null

workflows:
  # Branch A: a single non-identity step that drops 'format'.
  - name: drop_format
    description: Removes the 'format' field from the File content schema
    workflow:
      operations:
        - name: transform_content
          description: Non-identity transform – drops 'format'
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "checksum": {"type": "string"},
                "filename": {"type": "string"},
                "size": {"type": "integer"}
              },
              "required": ["checksum", "filename", "size"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: |
              checksum: {{ original["checksum"] }}
              filename: {{ original["filename"] }}
              size: {{ original["size"] }}

  # Branch B: identity step followed by non-identity step – same net result as
  # drop_format alone (the identity step is a no-op with respect to the schema).
  - name: identity_then_drop_format
    description: Identity pass followed by the non-identity drop_format step
    workflow:
      operations:
        - name: transform_content
          description: Step 1 – identity, schema unchanged
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "checksum": {"type": "string"},
                "filename": {"type": "string"},
                "format": {"type": "string"},
                "size": {"type": "integer"}
              },
              "required": ["checksum", "filename", "format", "size"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: |
              checksum: {{ original["checksum"] }}
              filename: {{ original["filename"] }}
              format: {{ original["format"] }}
              size: {{ original["size"] }}
        - name: transform_content
          description: Step 2 – drop 'format'
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "checksum": {"type": "string"},
                "filename": {"type": "string"},
                "size": {"type": "integer"}
              },
              "required": ["checksum", "filename", "size"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: |
              checksum: {{ original["checksum"] }}
              filename: {{ original["filename"] }}
              size: {{ original["size"] }}

  # Used for the final convergence step on both D1→D_out and D2→D_out:
  # both intermediates already lack 'format', so a pass-through is sufficient.
  - name: passthrough_no_format
    description: Pass-through for a schema that already has no 'format' field
    workflow:
      operations:
        - name: transform_content
          description: Identity pass on the reduced schema
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "checksum": {"type": "string"},
                "filename": {"type": "string"},
                "size": {"type": "integer"}
              },
              "required": ["checksum", "filename", "size"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: |
              checksum: {{ original["checksum"] }}
              filename: {{ original["filename"] }}
              size: {{ original["size"] }}

routes:
  # Branch A: single non-identity step
  - input_model_name: I1
    workflow_name: drop_format
    output_model_name: D1

  # Branch B: identity step then non-identity step
  - input_model_name: I2
    workflow_name: identity_then_drop_format
    output_model_name: D2

  # Both intermediates converge on D_out with a compatible (no 'format') schema
  - input_model_name: D1
    workflow_name: passthrough_no_format
    output_model_name: D_out

  - input_model_name: D2
    workflow_name: passthrough_no_format
    output_model_name: D_out
