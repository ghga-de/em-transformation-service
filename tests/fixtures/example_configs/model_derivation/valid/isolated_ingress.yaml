# Two isolated ingress models (IngressModel2, IngressModel3) and one ingress model
# (IngressModel1) with a route to a derived model (DerivedModel1) via rename_id_property.
#
# Graph:
#     IngressModel1 → DerivedModel1
#     IngressModel2 (isolated)
#     IngressModel3 (isolated)

models:
  - name: IngressModel1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_: &file_schema
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: ../../_schemas/file_content.json

  - name: IngressModel2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: -1
    schema_: *file_schema

  - name: IngressModel3
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: -1
    schema_: *file_schema

  - name: DerivedModel1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

workflows:
  - name: rename_to_file_id
    description: Renames the File id property from alias to file_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename id from alias to file_id
          args:
            class_name: File
            id_property_name: file_id

routes:
  - input_model_name: IngressModel1
    workflow_name: rename_to_file_id
    output_model_name: DerivedModel1
