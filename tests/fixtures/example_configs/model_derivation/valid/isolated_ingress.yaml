# Two isolated ingress models (I2, I3) and one ingress model (I1) with a route to a derived model (D1).
#
# Graph:
#     I1 → D1
#     I2 (isolated)
#     I3 (isolated)

models:
  - name: I1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: I2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: -1
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: I3
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: -1
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: D1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

workflows:
  - name: identity_workflow
    description: Passes schema through unchanged
    workflow:
      operations:
        - name: transform_content
          description: Identity transform for testing
          args:
            class_name: File
            content_schema: {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "additionalProperties": false,
              "properties": {
                "checksum": {"type": "string"},
                "filename": {"type": "string"},
                "format": {"type": "string"},
                "size": {"type": "integer"}
              },
              "required": ["filename", "format", "checksum", "size"],
              "type": "object"
            }
            embedding_profile: {}
            content_template_yaml: |
              {% for key in content_property_names %}
                {{ key }}: {{ original[key] }}
              {% endfor %}

routes:
  - input_model_name: I1
    workflow_name: identity_workflow
    output_model_name: D1
