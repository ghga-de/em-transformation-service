# Fork graph: one ingress feeds two independent arms; D1 forks further.
#
# Graph:
#     I → D1 → D1a     (rename_id + replace_resource_ids)
#            → D1b     (rename_id + duplicate_class)
#     I → D2 → D2a     (replace_resource_ids + rename_id)

models:
  - name: I
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: D1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 3
    schema_: null

  - name: D2
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

  - name: D1a
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 5
    schema_: null

  - name: D1b
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 4
    schema_: null

  - name: D2a
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 2
    schema_: null

workflows:
  - name: rename_to_file_id
    description: Renames the File id property from alias to file_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename id from alias to file_id
          args:
            class_name: File
            id_property_name: file_id

  - name: replace_file_ids
    description: Replaces resource IDs for the File class
    workflow:
      operations:
        - name: replace_resource_ids
          description: Replace resource IDs
          args:
            class_name: File

  - name: add_backup_class
    description: Duplicates the File class as FileBackup
    workflow:
      operations:
        - name: duplicate_class
          description: Duplicate File as FileBackup
          args:
            source_class_name: File
            target_class_name: FileBackup

routes:
  - input_model_name: I
    workflow_name: rename_to_file_id
    output_model_name: D1

  - input_model_name: I
    workflow_name: replace_file_ids
    output_model_name: D2

  - input_model_name: D1
    workflow_name: replace_file_ids
    output_model_name: D1a

  - input_model_name: D1
    workflow_name: add_backup_class
    output_model_name: D1b

  - input_model_name: D2
    workflow_name: rename_to_file_id
    output_model_name: D2a
