# Convergence: two ingress models each feed an intermediate, both
# intermediates converge to a single output.
#
# Graph:
#     I1 → D1 → D_out
#     I2 → D2 → D_out

models:
  - name: I1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 2
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: I2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checksum": {"type": "string"},
              "filename": {"type": "string"},
              "format": {"type": "string"},
              "size": {"type": "integer"}
            },
            "required": ["filename", "format", "checksum", "size"],
            "type": "object"
          }

  - name: D1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 3
    schema_: null

  - name: D2
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

  - name: D_out
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 4
    schema_: null

workflows:
  - name: replace_file_ids
    description: Replaces resource IDs for the File class
    workflow:
      operations:
        - name: replace_resource_ids
          description: Replace resource IDs
          args:
            class_name: File

  - name: rename_to_file_id
    description: Renames the File id property from alias to file_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename id from alias to file_id
          args:
            class_name: File
            id_property_name: file_id

routes:
  - input_model_name: I1
    workflow_name: replace_file_ids
    output_model_name: D1

  - input_model_name: I2
    workflow_name: replace_file_ids
    output_model_name: D2

  - input_model_name: D1
    workflow_name: rename_to_file_id
    output_model_name: D_out

  - input_model_name: D2
    workflow_name: rename_to_file_id
    output_model_name: D_out
