# Convergence: two ingress models each feed an intermediate, both
# intermediates converge to a single output.
#
# Graph:
#     IngressModel1 → DerivedModel1 → ConvergedModel
#     IngressModel2 → DerivedModel2 → ConvergedModel

models:
  - name: IngressModel1
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 2
    schema_: &file_schema
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: ../../_schemas/file_content.json

  - name: IngressModel2
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_: *file_schema

  - name: DerivedModel1
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 3
    schema_: null

  - name: DerivedModel2
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 1
    schema_: null

  - name: ConvergedModel
    is_ingress: false
    version: "1.0.0"
    publish: false
    order: 4
    schema_: null

workflows:
  - name: replace_file_ids
    description: Replaces resource IDs for the File class
    workflow:
      operations:
        - name: replace_resource_ids
          description: Replace resource IDs
          args:
            class_name: File

  - name: rename_to_file_id
    description: Renames the File id property from alias to file_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename id from alias to file_id
          args:
            class_name: File
            id_property_name: file_id

routes:
  - input_model_name: IngressModel1
    workflow_name: replace_file_ids
    output_model_name: DerivedModel1

  - input_model_name: IngressModel2
    workflow_name: replace_file_ids
    output_model_name: DerivedModel2

  - input_model_name: DerivedModel1
    workflow_name: rename_to_file_id
    output_model_name: ConvergedModel

  - input_model_name: DerivedModel2
    workflow_name: rename_to_file_id
    output_model_name: ConvergedModel
