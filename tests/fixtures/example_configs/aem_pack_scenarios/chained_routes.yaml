# Chained routes: IngressModel → DerivedModel1 → DerivedModel2 → DerivedModel3,
# alternating between rename_to_file_id and rename_to_resource_id workflows.
#
# Graph:
#     IngressModel → DerivedModel1 → DerivedModel2 → DerivedModel3

models:
  - name: IngressModel
    is_ingress: true
    version: "1.0.0"
    publish: false
    order: 0
    schema_:
      schemapack: "4.0.0"
      classes:
        File:
          id:
            propertyName: alias
          content: ../_schemas/file_content.json

  - name: DerivedModel1
    is_ingress: false
    version: null
    publish: false
    order: 1
    schema_: null

  - name: DerivedModel2
    is_ingress: false
    version: null
    publish: false
    order: 2
    schema_: null

  - name: DerivedModel3
    is_ingress: false
    version: null
    publish: true
    order: 3
    schema_: null

workflows:
  - name: rename_to_file_id
    description: Renames the File id property from alias to file_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename id from alias to file_id
          args:
            class_name: File
            id_property_name: file_id

  - name: rename_to_resource_id
    description: Renames the File id property to resource_id
    workflow:
      operations:
        - name: rename_id_property
          description: Rename id to resource_id
          args:
            class_name: File
            id_property_name: resource_id

routes:
  - input_model_name: IngressModel
    workflow_name: rename_to_file_id
    output_model_name: DerivedModel1

  - input_model_name: DerivedModel1
    workflow_name: rename_to_resource_id
    output_model_name: DerivedModel2

  - input_model_name: DerivedModel2
    workflow_name: rename_to_file_id
    output_model_name: DerivedModel3
