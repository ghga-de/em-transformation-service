# Isolated published ingress survives; ingresses with no published models are pruned.
#
# Subgraph 1 (orphaned):
#     I1(unpub)    ← pruned
#
# Subgraph 2:
#     A(pub)
#
# Subgraph 3:
#     I2(unpub) --[wf]--> B(unpub)    ← both pruned

config:
  models:
    - name: I1
      order: 0
      publish: false
      is_ingress: true
      version: null
      schema_:
        schemapack: "4.0.0"
        classes:
          Item:
            id:
              propertyName: id
            content:
              type: object
              additionalProperties: false
    - name: A
      order: 1
      publish: true
      is_ingress: true
      version: null
      schema_:
        schemapack: "4.0.0"
        classes:
          Item:
            id:
              propertyName: id
            content:
              type: object
              additionalProperties: false
    - name: I2
      order: 2
      publish: false
      is_ingress: true
      version: null
      schema_:
        schemapack: "4.0.0"
        classes:
          Item:
            id:
              propertyName: id
            content:
              type: object
              additionalProperties: false
    - name: B
      order: 3
      publish: false
      is_ingress: false
      version: null
      schema_: null
  routes:
    - input_model_name: I2
      workflow_name: wf
      output_model_name: B
  workflows:
    - name: wf
      workflow:
        operations:
          - name: step
            description: test step
            args: {}
