# A workflow referenced only by removed routes is pruned;
# a workflow still referenced by a surviving route is kept.
#
# Graph:
#     PublishedSource --[kept_workflow]--> PublishedDerived --[dropped_workflow]--> UnpublishedLeaf

config:
  models:
    - name: PublishedSource
      order: 0
      publish: true
      is_ingress: true
      version: null
      schema_:
        schemapack: "4.0.0"
        classes:
          Item:
            id:
              propertyName: id
            content:
              type: object
              additionalProperties: false
    - name: PublishedDerived
      order: 1
      publish: true
      is_ingress: false
      version: null
      schema_: null
    - name: UnpublishedLeaf
      order: 2
      publish: false
      is_ingress: false
      version: null
      schema_: null
  routes:
    - input_model_name: PublishedSource
      workflow_name: kept_workflow
      output_model_name: PublishedDerived
    - input_model_name: PublishedDerived
      workflow_name: dropped_workflow
      output_model_name: UnpublishedLeaf
  workflows:
    - name: kept_workflow
      description: Passes content schema through unchanged
      workflow:
        operations:
          - name: transform_content
            description: Identity transformation
            args:
              class_name: Item
              content_schema:
                type: object
                additionalProperties: false
              embedding_profile: {}
              content_template_yaml: |
                {% for key in content_property_names %}
                  {{ key }}: {{ original[key] }}
                {% endfor %}
    - name: dropped_workflow
      description: Passes content schema through unchanged
      workflow:
        operations:
          - name: transform_content
            description: Identity transformation
            args:
              class_name: Item
              content_schema:
                type: object
                additionalProperties: false
              embedding_profile: {}
              content_template_yaml: |
                {% for key in content_property_names %}
                  {{ key }}: {{ original[key] }}
                {% endfor %}
