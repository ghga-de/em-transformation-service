# UnpublishedLeaf and its route are pruned; UnpublishedEMIM survives as an ingress
# model (is_ingress=True) despite having no published downstream.
#
# Subgraph 1:
#     UnpublishedSource --[workflow]--> PublishedDerived
#
# Subgraph 2:
#     UnpublishedEMIM --[workflow]--> UnpublishedLeaf

config:
  models:
    - name: UnpublishedSource
      order: 0
      publish: false
      is_ingress: true
      version: null
      schema_: &item_schema
        schemapack: "4.0.0"
        classes:
          Item:
            id:
              propertyName: id
            content:
              type: object
              additionalProperties: false
    - name: PublishedDerived
      order: 1
      publish: true
      is_ingress: false
      version: null
      schema_: null
    - name: UnpublishedEMIM
      order: 2
      publish: false
      is_ingress: true
      version: null
      schema_: *item_schema
    - name: UnpublishedLeaf
      order: 3
      publish: false
      is_ingress: false
      version: null
      schema_: null

  routes:
    - input_model_name: UnpublishedSource
      workflow_name: workflow
      output_model_name: PublishedDerived
    - input_model_name: UnpublishedEMIM
      workflow_name: workflow
      output_model_name: UnpublishedLeaf
  workflows:
    - name: workflow
      description: Passes content schema through unchanged
      workflow:
        operations:
          - name: transform_content
            description: Identity transformation
            args:
              class_name: Item
              content_schema:
                type: object
                additionalProperties: false
              embedding_profile: {}
              content_template_yaml: |
                {% for key in content_property_names %}
                  {{ key }}: {{ original[key] }}
                {% endfor %}
