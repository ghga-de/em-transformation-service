# A workflow referenced only by removed routes is pruned;
# a workflow still referenced by a surviving route is kept.
#
# Graph:
#     I(pub) --[wf_keep]--> A(pub) --[wf_drop]--> B(unpub)    ← B and wf_drop pruned

config:
  models:
    - name: I
      order: 0
      publish: true
      is_ingress: true
      version: null
      schema_:
        schemapack: "4.0.0"
        classes:
          Item:
            id:
              propertyName: id
            content:
              type: object
              additionalProperties: false
    - name: A
      order: 1
      publish: true
      is_ingress: false
      version: null
      schema_: null
    - name: B
      order: 2
      publish: false
      is_ingress: false
      version: null
      schema_: null
  routes:
    - input_model_name: I
      workflow_name: wf_keep
      output_model_name: A
    - input_model_name: A
      workflow_name: wf_drop
      output_model_name: B
  workflows:
    - name: wf_keep
      workflow:
        operations:
          - name: step
            description: test step
            args: {}
    - name: wf_drop
      workflow:
        operations:
          - name: step
            description: test step
            args: {}
