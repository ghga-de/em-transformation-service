# A route whose input model is pruned is also removed;
# the orphaned workflow is pruned because no surviving route references it.
#
# Graph:
#     I(pub) --[wf]--> A(unpub) --[wf]--> B(unpub)    ← A, B, both routes, and wf pruned

config:
  models:
    - name: I
      order: 0
      publish: true
      is_ingress: true
      version: null
      schema_:
        schemapack: "4.0.0"
        classes:
          Item:
            id:
              propertyName: id
            content:
              type: object
              additionalProperties: false
    - name: A
      order: 1
      publish: false
      is_ingress: false
      version: null
      schema_: null
    - name: B
      order: 2
      publish: false
      is_ingress: false
      version: null
      schema_: null
  routes:
    - input_model_name: I
      workflow_name: wf
      output_model_name: A
    - input_model_name: A
      workflow_name: wf
      output_model_name: B
  workflows:
    - name: wf
      workflow:
        operations:
          - name: step
            description: test step
            args: {}
