# Invalid: route graph contains a cycle.
#
# Graph:
#     ingress_model → derived_model_1 → derived_model_2 → ingress_model

models:
  - name: ingress_model
    description: Ingress model
    is_ingress: true
    version: "1.0.0"
    schema_:
      schemapack: "4.0.0"
      classes:
        TestClass:
          id:
            propertyName: id
          content:
            type: object
    publish: false

  - name: derived_model_1
    description: First derived model
    is_ingress: false
    version: "1.0.0"
    schema_: null
    publish: false

  - name: derived_model_2
    description: Second derived model
    is_ingress: false
    version: "1.0.0"
    schema_: null
    publish: false

workflows:
  - name: test_workflow
    description: Test workflow
    workflow:
      operations:
        - name: delete_class
          description: Delete class operation
          args:
            class_name: TestClass

routes:
  - input_model_name: ingress_model
    workflow_name: test_workflow
    output_model_name: derived_model_1
  - input_model_name: derived_model_1
    workflow_name: test_workflow
    output_model_name: derived_model_2
  - input_model_name: derived_model_2
    workflow_name: test_workflow
    output_model_name: ingress_model
