# Invalid: Route references non-existent workflow
models:
  - name: ingress_model
    description: Ingress model
    is_ingress: true
    version: "1.0.0"
    schema_:
      schemapack: "4.0.0"
      classes:
        TestClass:
          id:
            propertyName: id
          content:
            type: object
    publish: true

  - name: output_model
    description: Output model
    is_ingress: false
    version: "1.0.0"
    schema_: null
    publish: false

workflows:
  - name: existing_workflow
    description: Existing workflow
    workflow:
      operations:
        - name: delete_class
          description: Delete class operation
          args: {}

routes:
  - name: "ingress_model:nonexistent_workflow:output_model"
    input_model_name: ingress_model
    workflow_name: nonexistent_workflow
    output_model_name: output_model
